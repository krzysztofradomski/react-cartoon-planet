<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="none" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="ocean" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#47bfff"/>
      <stop offset="55%" stop-color="#2a8fd4"/>
      <stop offset="100%" stop-color="#1a5f9e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#73b3ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#73b3ff" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="globe">
      <circle cx="24" cy="24" r="18"/>
    </clipPath>
  </defs>

  <!-- atmosphere halo -->
  <circle cx="24" cy="24" r="21" fill="url(#glow)"/>

  <!-- globe body -->
  <circle cx="24" cy="24" r="18" fill="url(#ocean)"/>

  <!-- continents & grid -->
  <g clip-path="url(#globe)">
    <ellipse cx="18" cy="20" rx="7" ry="5" fill="#863bff" opacity="0.9"/>
    <ellipse cx="30" cy="28" rx="6" ry="4.5" fill="#7e14ff" opacity="0.85"/>
    <path fill="#863bff" opacity="0.75" d="M12 14c2-1 5-1 7 1s3 4 2 6-4 2-6 0-4-4-3-7z"/>

    <ellipse cx="24" cy="24" rx="17" ry="6" stroke="#ede6ff" stroke-width="1.1" fill="none" opacity="0.55"/>
    <ellipse cx="24" cy="24" rx="17" ry="11" stroke="#ede6ff" stroke-width="1.1" fill="none" opacity="0.4"/>
    <ellipse cx="24" cy="24" rx="6" ry="17" stroke="#ede6ff" stroke-width="1.1" fill="none" opacity="0.45"/>
    <ellipse cx="24" cy="24" rx="11" ry="17" stroke="#ede6ff" stroke-width="1.1" fill="none" opacity="0.35"/>
  </g>

  <!-- specular highlight -->
  <ellipse cx="17" cy="16" rx="5" ry="3.5" fill="#fff" opacity="0.22" transform="rotate(-25 17 16)"/>

  <!-- rim -->
  <circle cx="24" cy="24" r="18" stroke="#ede6ff" stroke-width="1.2" fill="none" opacity="0.35"/>
</svg>
