<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cartoon Planet — globe to meters</title>
  <style>
    :root {
      --ink: #1a1d24;
      --paper: #f6efe2;
      --accent: #ff5e3a;
      --hud-bg: rgba(20, 26, 36, 0.78);
      --hud-bg-strong: rgba(20, 26, 36, 0.92);
      --hud-fg: #f3ead2;
      --hud-dim: #9aa2b1;
    }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; }
    body {
      background: #0a0e1a;
      font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--hud-fg);
      overflow: hidden;
    }
    .root { position: relative; width: 100%; height: 100%; }
    .canvas-mount { position: absolute; inset: 0; }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }

    /* HUD --------------------------------------------------------------- */
    .hud {
      position: absolute;
      background: var(--hud-bg);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      font-feature-settings: "tnum" 1;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .hud-tl { top: 16px; left: 16px; min-width: 180px; }
    .hud-row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; line-height: 1.8; }
    .hud-label { color: var(--hud-dim); letter-spacing: 0.12em; font-size: 11px; }
    .hud-value { color: var(--hud-fg); font-variant-numeric: tabular-nums; }

    /* Scale bar --------------------------------------------------------- */
    .scalebar {
      position: absolute;
      bottom: 22px;
      left: 22px;
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      background: var(--hud-bg);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    .scalebar-track {
      position: relative;
      height: 6px;
      background: linear-gradient(90deg, #f3ead2 50%, #1a1d24 50%);
      background-size: 30px 6px;
      border: 1px solid #f3ead2;
      border-radius: 1px;
      transition: width 120ms ease-out;
    }
    .scalebar-label { font-size: 12px; color: var(--hud-fg); font-variant-numeric: tabular-nums; }

    /* Right panel ------------------------------------------------------- */
    .panel {
      position: absolute;
      top: 16px; right: 16px;
      width: 220px;
      background: var(--hud-bg-strong);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(8px);
    }
    .panel-title {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--hud-dim);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .segmented {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 4px;
      margin-bottom: 12px;
      padding: 3px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
    }
    .panel button {
      display: block; width: 100%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.10);
      color: var(--hud-fg);
      text-align: left;
      padding: 8px 10px;
      border-radius: 8px;
      font: inherit; font-size: 13px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background 100ms, border-color 100ms, transform 80ms;
    }
    .panel .segmented button {
      text-align: center;
      margin: 0;
      padding: 6px 8px;
      border-color: transparent;
      border-radius: 6px;
    }
    .panel .segmented button.is-active {
      background: rgba(243,234,210,0.14);
      border-color: rgba(243,234,210,0.28);
    }
    .panel button:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.18); }
    .panel button:active { transform: translateY(1px); }

    /* City tooltip ------------------------------------------------------ */
    .city-tip {
      position: fixed;
      pointer-events: none;
      background: var(--hud-bg-strong);
      color: var(--hud-fg);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .marker-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .marker-label {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      transform: translate(-50%, calc(-100% - 14px));
      padding: 5px 8px;
      min-width: 0;
      max-width: 180px;
      color: var(--hud-fg);
      background: rgba(12, 18, 29, 0.78);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .marker-swatch {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }
    .marker-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--hud-dim);
      font-size: 12px;
      letter-spacing: 0.05em;
      background: rgba(20,26,36,0.5);
      padding: 5px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }

    /* Cyberpunk theme styling overrides */
    .root.mode-cyberpunk {
      --hud-bg: rgba(10, 5, 24, 0.85);
      --hud-bg-strong: rgba(15, 6, 36, 0.94);
      --hud-fg: #00f5ff; /* neon cyan text! */
      --hud-dim: #ff2eea; /* neon pink/magenta labels! */
      --accent: #ff2eea;
    }
    
    /* Neon glow effect on cyberpunk elements */
    .mode-cyberpunk .hud,
    .mode-cyberpunk .panel,
    .mode-cyberpunk .scalebar {
      border: 1px solid rgba(255, 46, 234, 0.35);
      box-shadow: 0 0 15px rgba(255, 46, 234, 0.25), inset 0 0 8px rgba(0, 245, 255, 0.1);
    }
    
    /* Diagonal sci-fi corner cuts / warning stripes on panels */
    .mode-cyberpunk .panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #ff2eea 0%, #00f5ff 50%, #ffe600 100%);
      border-radius: 12px 12px 0 0;
    }
    
    .mode-cyberpunk .hud-tl::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00f5ff 0%, #ff2eea 100%);
      border-radius: 10px 10px 0 0;
    }
    
    /* Cyberpunk styled buttons */
    .mode-cyberpunk button {
      border: 1px solid rgba(0, 245, 255, 0.25);
      color: #00f5ff;
      text-shadow: 0 0 4px rgba(0, 245, 255, 0.3);
    }
    .mode-cyberpunk button:hover {
      background: rgba(0, 245, 255, 0.12);
      border-color: #00f5ff;
      box-shadow: 0 0 8px rgba(0, 245, 255, 0.4);
      color: #fff;
    }
    
    .mode-cyberpunk .panel .segmented button.is-active {
      background: rgba(255, 46, 234, 0.25);
      border-color: #ff2eea;
      color: #fff;
      text-shadow: 0 0 6px #ff2eea;
      box-shadow: 0 0 8px rgba(255, 46, 234, 0.5);
    }
    
    .mode-cyberpunk .segmented {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 46, 234, 0.2);
    }
    
    /* Cyberpunk HTML marker labels */
    .mode-cyberpunk .marker-label {
      background: rgba(10, 5, 24, 0.9);
      border: 1px solid #ff2eea;
      box-shadow: 0 0 10px rgba(255, 46, 234, 0.35);
      color: #fff;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    
    .mode-cyberpunk .marker-swatch {
      box-shadow: 0 0 8px currentColor;
    }
    
    /* Scalebar adjustments */
    .mode-cyberpunk .scalebar-track {
      background: linear-gradient(90deg, #00f5ff 50%, rgba(255, 46, 234, 0.1) 50%);
      border: 1px solid #00f5ff;
      background-size: 20px 6px;
    }
    .mode-cyberpunk .scalebar-label {
      color: #00f5ff;
      text-shadow: 0 0 4px rgba(0, 245, 255, 0.3);
    }
    /* Floating widgets sidebar container */
    .hud-overlay-container {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 250px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none; /* Let clicks pass through empty spaces to rotate globe */
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
    }
    
    /* Enable pointer events on panels inside the floating container */
    .hud-overlay-container .panel,
    .hud-overlay-container .segmented,
    .hud-overlay-container button {
      pointer-events: auto;
    }

    /* Style for modular floating panels */
    .panel {
      position: static; /* override absolute position from earlier panel rules */
      width: 100%;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    /* Dynamic placing toast */
    .placing-toast {
      position: absolute;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--hud-bg-strong);
      border: 1px solid var(--accent);
      color: var(--hud-fg);
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 999px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      animation: pulse-glow 1.8s infinite ease-in-out;
      backdrop-filter: blur(8px);
      z-index: 1000;
      pointer-events: none;
    }
    
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 10px rgba(255, 94, 58, 0.2);
        border-color: rgba(255, 94, 58, 0.4);
      }
      50% {
        box-shadow: 0 0 25px rgba(255, 94, 58, 0.6);
        border-color: rgba(255, 94, 58, 1);
      }
    }
    
    .mode-cyberpunk .placing-toast {
      animation: pulse-glow-cyber 1.8s infinite ease-in-out;
    }
    
    @keyframes pulse-glow-cyber {
      0%, 100% {
        box-shadow: 0 0 10px rgba(255, 46, 234, 0.2);
        border-color: rgba(255, 46, 234, 0.4);
        color: #00f5ff;
      }
      50% {
        box-shadow: 0 0 25px rgba(255, 46, 234, 0.6);
        border-color: rgba(255, 46, 234, 1);
        color: #fff;
      }
    }

    /* Scrollable Marker List */
    .marker-list {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 8px;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    /* Scrollbar styling for panels */
    .hud-overlay-container::-webkit-scrollbar,
    .marker-list::-webkit-scrollbar {
      width: 4px;
    }
    .hud-overlay-container::-webkit-scrollbar-track,
    .marker-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .hud-overlay-container::-webkit-scrollbar-thumb,
    .marker-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
    }
    
    .mode-cyberpunk .hud-overlay-container::-webkit-scrollbar-thumb,
    .mode-cyberpunk .marker-list::-webkit-scrollbar-thumb {
      background: rgba(0, 245, 255, 0.25);
    }

    /* Single marker item in list */
    .marker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px;
      font-size: 11px;
    }
    
    .mode-cyberpunk .marker-item {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 46, 234, 0.15);
    }
    
    .marker-item-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    
    .marker-item-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    
    .marker-item-coords {
      color: var(--hud-dim);
      font-size: 9px;
      margin-left: 2px;
    }
    
    .marker-item-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .marker-item-btn {
      background: transparent !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      padding: 3px 6px !important;
      font-size: 9px !important;
      border-radius: 4px !important;
      cursor: pointer;
      margin: 0 !important;
      width: auto !important;
      display: inline-block !important;
      text-align: center !important;
    }
    
    .marker-item-btn:hover {
      background: rgba(255,255,255,0.08) !important;
      border-color: rgba(255,255,255,0.2) !important;
    }
    
    .marker-item-btn-delete {
      color: #ff5e3a !important;
      border-color: rgba(255, 94, 58, 0.2) !important;
    }
    .marker-item-btn-delete:hover {
      background: rgba(255, 94, 58, 0.12) !important;
      border-color: #ff5e3a !important;
    }
    
    .mode-cyberpunk .marker-item-btn {
      color: #00f5ff !important;
      border-color: rgba(0, 245, 255, 0.25) !important;
    }
    
    .mode-cyberpunk .marker-item-btn:hover {
      background: rgba(0, 245, 255, 0.12) !important;
      border-color: #00f5ff !important;
    }
    
    .mode-cyberpunk .marker-item-btn-delete {
      color: #ff2eea !important;
      border-color: rgba(255, 46, 234, 0.25) !important;
    }
    .mode-cyberpunk .marker-item-btn-delete:hover {
      background: rgba(255, 46, 234, 0.15) !important;
      border-color: #ff2eea !important;
      text-shadow: 0 0 4px #ff2eea;
      box-shadow: 0 0 6px rgba(255, 46, 234, 0.4);
    }

    /* Marker editor dialog card */
    .marker-editor-card {
      background: var(--hud-bg-strong);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .mode-cyberpunk .marker-editor-card {
      border: 1px solid rgba(255, 46, 234, 0.35);
      box-shadow: 0 0 10px rgba(255, 46, 234, 0.2);
    }
    
    .marker-editor-title {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--hud-dim);
      font-weight: bold;
    }
    
    .marker-editor-input {
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      padding: 5px 8px;
      color: var(--hud-fg);
      font-size: 11px;
      width: 100%;
      outline: none;
    }
    
    .mode-cyberpunk .marker-editor-input {
      border-color: rgba(0, 245, 255, 0.3);
    }
    .mode-cyberpunk .marker-editor-input:focus {
      border-color: #00f5ff;
      box-shadow: 0 0 6px rgba(0, 245, 255, 0.3);
    }
    
    .marker-editor-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .marker-editor-colors {
      display: flex;
      gap: 6px;
    }
    
    .color-swatch-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0 !important;
      margin: 0 !important;
      display: inline-block !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      transition: transform 100ms;
    }
    
    .color-swatch-btn:hover {
      transform: scale(1.15);
    }
    .color-swatch-btn.is-active {
      border-color: #fff;
      transform: scale(1.1);
    }
    
    .marker-editor-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    
    .marker-editor-btn {
      flex: 1;
      font-size: 11px !important;
      padding: 6px 8px !important;
      text-align: center !important;
      justify-content: center !important;
    }
    
    .marker-editor-btn-save {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #fff !important;
    }
    
    .mode-cyberpunk .marker-editor-btn-save {
      background: rgba(0, 245, 255, 0.15) !important;
      border-color: #00f5ff !important;
      color: #00f5ff !important;
      text-shadow: 0 0 4px #00f5ff;
    }
    
    .mode-cyberpunk .marker-editor-btn-save:hover {
      background: rgba(0, 245, 255, 0.3) !important;
      box-shadow: 0 0 8px rgba(0, 245, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="continents.js"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
